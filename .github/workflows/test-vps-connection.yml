
name: Test VPS Connection

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Test TCP connection to VPS
        shell: powershell
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          Write-Host "Testing connection from local Windows..."

          $result = Test-NetConnection `
            -ComputerName $env:VPS_HOST `
            -Port ([int]$env:VPS_PORT) `
            -WarningAction SilentlyContinue

          if ($result.TcpTestSucceeded) {
            Write-Host "SUCCESS: VPS SSH port is reachable."
          } else {
            Write-Host "FAILED: Cannot connect to VPS SSH port."
            exit 1
          }
