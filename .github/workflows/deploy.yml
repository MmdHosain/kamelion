
name: Build and Push Kamelion Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: kamelion-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use official npm registry in CI
        shell: bash
        run: |
          sed -i \
            's|https://mirror-npm.runflare.com/|https://registry.npmjs.org/|g' \
            front-end/package-lock.json

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend_core
          file: ./backend_core/Dockerfile
          push: true
          tags: |
            ghcr.io/mmdhosain/kamelion-backend:latest
            ghcr.io/mmdhosain/kamelion-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: |
            ghcr.io/mmdhosain/kamelion-frontend:latest
            ghcr.io/mmdhosain/kamelion-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Deploy to VPS
        shell: pwsh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($name in @(
            'VPS_HOST',
            'VPS_USER',
            'VPS_PORT',
            'VPS_SSH_KEY',
            'GHCR_READ_TOKEN'
          )) {
            if ([string]::IsNullOrWhiteSpace(
              [Environment]::GetEnvironmentVariable($name)
            )) {
              throw "Required GitHub secret is missing: $name"
            }
          }

          $keyPath = Join-Path $env:RUNNER_TEMP 'kamelion-deploy-key'
          $remotePath = Join-Path $env:RUNNER_TEMP 'kamelion-deploy.sh'

          $remoteScript = @'
          set -Eeuo pipefail

          IFS= read -r GHCR_READ_TOKEN

          DEPLOY_DIR="$HOME/deploy"

          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "ERROR: Deployment directory does not exist: $DEPLOY_DIR"
            exit 1
          fi

          cd "$DEPLOY_DIR"

          if ! docker compose config --quiet; then
            echo "ERROR: Docker Compose configuration is invalid or missing."
            exit 1
          fi

          services="$(docker compose config --services)"

          for service in backend frontend; do
            if ! grep -Fxq "$service" <<< "$services"; then
              echo "ERROR: Compose service '$service' is missing."
              exit 1
            fi
          done

          printf '%s' "$GHCR_READ_TOKEN" |
            docker login ghcr.io \
              --username MmdHosain \
              --password-stdin

          unset GHCR_READ_TOKEN

          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          docker pull ghcr.io/mmdhosain/kamelion-backend:latest
          docker pull ghcr.io/mmdhosain/kamelion-frontend:latest

          docker tag \
            ghcr.io/mmdhosain/kamelion-backend:latest \
            kamelion-backend:latest

          docker tag \
            ghcr.io/mmdhosain/kamelion-frontend:latest \
            kamelion-frontend:latest

          docker compose up -d --no-build backend frontend

          docker compose ps backend frontend
          '@

          try {
            [System.IO.File]::WriteAllText(
              $keyPath,
              $env:VPS_SSH_KEY.Trim() + "`n",
              [System.Text.Encoding]::ASCII
            )

            [System.IO.File]::WriteAllText(
              $remotePath,
              $remoteScript,
              [System.Text.UTF8Encoding]::new($false)
            )

            $payload = $env:GHCR_READ_TOKEN + "`n"
            $payload += [System.IO.File]::ReadAllText($remotePath)

            $payload | ssh.exe `
              -i $keyPath `
              -p $env:VPS_PORT `
              -o BatchMode=yes `
              -o ConnectTimeout=30 `
              -o StrictHostKeyChecking=accept-new `
              "$env:VPS_USER@$env:VPS_HOST" `
              "bash -s"

            if ($LASTEXITCODE -ne 0) {
              throw "VPS deployment failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Remove-Item $keyPath, $remotePath `
              -Force -ErrorAction SilentlyContinue
          }
