
name: Build and Push Kamelion Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use official npm registry in CI
        run: |
          sed -i 's|https://mirror-npm.runflare.com/|https://registry.npmjs.org/|g' front-end/package-lock.json

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend_core
          file: ./backend_core/Dockerfile
          push: true
          tags: |
            ghcr.io/mmdhosain/kamelion-backend:latest
            ghcr.io/mmdhosain/kamelion-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: |
            ghcr.io/mmdhosain/kamelion-frontend:latest
            ghcr.io/mmdhosain/kamelion-frontend:${{ github.sha }}
