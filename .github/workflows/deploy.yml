
name: Build and Deploy Kamelion

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use official npm registry in CI
        run: |
          sed -i 's|https://mirror-npm.runflare.com/|https://registry.npmjs.org/|g' front-end/package-lock.json

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend_core
          file: ./backend_core/Dockerfile
          push: true
          tags: |
            ghcr.io/mmdhosain/kamelion-backend:latest
            ghcr.io/mmdhosain/kamelion-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: |
            ghcr.io/mmdhosain/kamelion-frontend:latest
            ghcr.io/mmdhosain/kamelion-frontend:${{ github.sha }}

 
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "$GHCR_READ_TOKEN" ]]; then
            echo "ERROR: GHCR_READ_TOKEN is empty or missing."
            exit 1
          fi

          printf '%s\n' "$GHCR_READ_TOKEN" |
            ssh \
              -i ~/.ssh/kamelion_deploy \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              "$VPS_USER@$VPS_HOST" \
              'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          IFS= read -r GHCR_READ_TOKEN || {
            echo "ERROR: Failed to receive GHCR token."
            exit 1
          }

          if [[ -z "$GHCR_READ_TOKEN" ]]; then
            echo "ERROR: Received an empty GHCR token."
            exit 1
          fi

          cd /root/kamelion

          test -f docker-compose.yml
          test -f .env

          printf '%s' "$GHCR_READ_TOKEN" |
            docker login ghcr.io \
              --username mmdhosain \
              --password-stdin

          unset GHCR_READ_TOKEN
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          docker pull ghcr.io/mmdhosain/kamelion-backend:latest
          docker pull ghcr.io/mmdhosain/kamelion-frontend:latest

          docker tag \
            ghcr.io/mmdhosain/kamelion-backend:latest \
            kamelion-backend:latest

          docker tag \
            ghcr.io/mmdhosain/kamelion-frontend:latest \
            kamelion-frontend:latest

          docker compose config -q
          docker compose up -d --no-build backend frontend
          docker compose ps
          REMOTE
