
name: Test VPS via Windows Runner

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 1

    steps:
      - name: Test VPS TCP connection
        shell: powershell
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          Write-Host "Runner: $env:COMPUTERNAME"
          Write-Host "Target: $env:VPS_HOST`:$env:VPS_PORT"

          $client = New-Object System.Net.Sockets.TcpClient
          try {
            $connect = $client.BeginConnect(
              $env:VPS_HOST,
              [int]$env:VPS_PORT,
              $null,
              $null
            )

            if (-not $connect.AsyncWaitHandle.WaitOne(5000)) {
              throw "Connection timed out after 5 seconds."
            }

            $client.EndConnect($connect)
            Write-Host "SUCCESS: VPS is reachable from Windows."
          }
          catch {
            Write-Host "FAILED: $($_.Exception.Message)"
            exit 1
          }
          finally {
            $client.Close()
          }
