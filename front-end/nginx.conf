
# This file is included inside nginx's http context by the Docker image.
map $http_user_agent $seo_preview_bot {
    default 0;
    ~*googlebot|bingbot 0;
    ~*telegram|whatsapp|twitterbot|facebookexternalhit|linkedinbot|slackbot|discordbot|baiduspider 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression (Moderate Level 5: Safe for all devices, minimal CPU load)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # The real / directory exists, so it needs its own bot dispatch before
    # try_files. Existing JS/CSS/images below are always served as assets.
    location = / {
        add_header Vary User-Agent always;
        error_page 418 = @seo_preview;
        if ($seo_preview_bot) { return 418; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ @frontend_page;
    }

    location @frontend_page {
        add_header Vary User-Agent always;
        error_page 418 = @seo_preview;
        if ($seo_preview_bot) { return 418; }
        try_files /index.html =404;
    }

    location @seo_preview {
        add_header Vary User-Agent always;
        rewrite ^ /api/seo/bot-preview/? break;
        proxy_pass http://backend:8000;
        proxy_set_header X-SEO-Path $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location = /robots.txt {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
