<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pink-ribbon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>دکتر نگار معشوری — کلینیک تخصصی بیماری‌ها و جراحی پستان</title>
    <meta
      name="description"
      content="کلینیک تخصصی پستان دکتر نگار معشوری — ارائه خدمات تشخیصی، جراحی‌های انکوپلاستی و درمانی، ماموپلاستی و غربالگری بیماری‌های پستان."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://drnegarmashoori.ir" />

    <!-- Open Graph Default Fallbacks -->
    <meta property="og:site_name" content="کلینیک تخصصی پستان دکتر نگار معشوری" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="دکتر نگار معشوری — کلینیک تخصصی بیماری‌ها و جراحی پستان" />
    <meta
      property="og:description"
      content="ارائه خدمات تخصصی جراحی پستان، انکوپلاستی، غربالگری و درمان بیماری‌های پستان توسط دکتر نگار معشوری."
    />
    <meta property="og:image" content="https://drnegarmashoori.ir/pink-ribbon.svg" />

    <!-- Preload Primary Persian Font for 3G/4G connections -->
    <link
      rel="preload"
      href="/fonts/vazirmatn-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>window.__appStart = performance.now();</script>
    <!-- Critical Pre-render Loader Styles (Zero ms FCP with anti-flicker delay) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #faf9fb;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #faf9fb;
        transition: opacity 0.3s ease-out;
      }
      .initial-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(225, 29, 72, 0.15);
        border-top-color: #e11d48;
        border-radius: 50%;
        opacity: 0;
        animation: app-spin 0.8s linear infinite, spinner-fade-in 0.25s ease-out 0.25s forwards;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes spinner-fade-in {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="initial-spinner" aria-label="Loading"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
